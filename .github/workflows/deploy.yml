name: Build and publish to deploy branch

on:
  push:
    branches:
      - main
      - claude/personal-web-portfolio-jg8sdg
  workflow_dispatch:

# The job needs write access to push the built files to the deploy branch.
permissions:
  contents: write

concurrency:
  group: deploy-branch
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Disable Jekyll so files/folders are served as-is.
      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Publish built site to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          force_orphan: true
